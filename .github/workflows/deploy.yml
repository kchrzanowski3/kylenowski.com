name: deploy

# PRs to main:    build, terraform plan (read-only), Firebase Hosting preview channel.
# Pushes to main: build, terraform apply, deploy dist/ to the live site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch/PR. Applies only happen on main, and GCS locks state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token -> GCP Workload Identity Federation (no keys)

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  FIREBASE_TOOLS: firebase-tools@15.37.0
  GCP_PROJECT_ID: kylenowski-com
  GCP_WIF_PROVIDER: projects/420500505231/locations/global/workloadIdentityPools/github/providers/github
  # ci-deployer can only be used by runs on refs/heads/main (enforced in GCP IAM).
  GCP_DEPLOYER_SA: ci-deployer@kylenowski-com.iam.gserviceaccount.com
  GCP_READER_SA: ci-reader@kylenowski-com.iam.gserviceaccount.com
  GCP_PREVIEW_SA: ci-preview@kylenowski-com.iam.gserviceaccount.com
  IS_DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build # astro check + astro build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.IS_DEPLOY == 'true' && env.GCP_DEPLOYER_SA || env.GCP_READER_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # Before the first apply there is no state, and creating it needs write
      # access that ci-reader doesn't have. Plan against an empty local state
      # instead, which is exactly what the first apply starts from.
      - name: Use empty state if none exists yet (PRs)
        if: env.IS_DEPLOY != 'true'
        run: |
          if ! out="$(gcloud storage objects describe gs://kylenowski-com-tfstate/site/default.tfstate 2>&1)"; then
            if grep -qiE 'not ?found|404' <<<"$out"; then
              printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
              echo "::notice::No Terraform state yet (first deploy): planning against an empty state."
            else
              echo "$out" >&2; exit 1
            fi
          fi

      - run: terraform init -input=false
      - run: terraform validate

      # PR plans run as the read-only ci-reader, which can't write the state
      # lock, so they skip locking (a plan never writes state anyway).
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan ${{ env.IS_DEPLOY == 'true' && '-lock-timeout=5m' || '-lock=false' }}

      - name: Plan summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan | tail -c 60000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: terraform apply (main only)
        if: env.IS_DEPLOY == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Outputs summary (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          {
            echo '### Terraform outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hosting:
    needs: [build, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # for firebase.json
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.IS_DEPLOY == 'true' && env.GCP_DEPLOYER_SA || env.GCP_PREVIEW_SA }}

      - name: Deploy live site (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project "$GCP_PROJECT_ID" \
            --non-interactive --message "${GITHUB_SHA::7}"
          echo "### Deployed ${GITHUB_SHA::7} to https://kylenowski.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview channel (PRs)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --no-authorized-domains --project "$GCP_PROJECT_ID" --non-interactive --json > channel.json || { cat channel.json; exit 1; }
          url="$(jq -r '.result[].url' channel.json)"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview URL::$url"
