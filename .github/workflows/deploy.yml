name: deploy

# PRs to main:    build, tests, terraform plan (read-only), Firebase Hosting preview channel.
# Pushes to main: build, tests, terraform apply, deploy dist/ to the live site.
# Nothing is applied or deployed unless the tests pass. After a production deploy, read-only smoke
# tests check the live site, and the merged PR gets a comment saying whether it all worked.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch/PR. Applies only happen on main, and GCS locks state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token -> GCP Workload Identity Federation (no keys)

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  FIREBASE_TOOLS: firebase-tools@15.37.0
  GCP_PROJECT_ID: kylenowski-com
  GCP_WIF_PROVIDER: projects/420500505231/locations/global/workloadIdentityPools/github/providers/github
  # ci-deployer can only be used by runs on refs/heads/main (enforced in GCP IAM).
  GCP_DEPLOYER_SA: ci-deployer@kylenowski-com.iam.gserviceaccount.com
  GCP_READER_SA: ci-reader@kylenowski-com.iam.gserviceaccount.com
  GCP_PREVIEW_SA: ci-preview@kylenowski-com.iam.gserviceaccount.com
  IS_DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build # astro check + astro build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # docs/thanksgiving-spec.md, "Testing". Unit tests, then the Firestore rules, sign-in service and
  # pre-game refresh against the Firebase emulators, then end-to-end in a browser.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Emulator tests (rules, sign-in service, pre-game refresh)
        run: npm run test:emulator
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  infra:
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Thanksgiving admin's email address: a sensitive Terraform variable, so it's hidden in plans.
      TF_VAR_admin_email: ${{ secrets.TG_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      # Terraform zips functions/dist (infra/thanksgiving.tf), so build it before planning.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build Cloud Functions bundle
        working-directory: .
        run: npm ci && npm run build:functions

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.IS_DEPLOY == 'true' && env.GCP_DEPLOYER_SA || env.GCP_READER_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # Before the first apply there is no state, and creating it needs write
      # access that ci-reader doesn't have. Plan against an empty local state
      # instead, which is exactly what the first apply starts from.
      - name: Use empty state if none exists yet (PRs)
        if: env.IS_DEPLOY != 'true'
        run: |
          if ! out="$(gcloud storage objects describe gs://kylenowski-com-tfstate/site/default.tfstate 2>&1)"; then
            if grep -qiE 'not ?found|404' <<<"$out"; then
              printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
              echo "::notice::No Terraform state yet (first deploy): planning against an empty state."
            else
              echo "$out" >&2; exit 1
            fi
          fi

      - run: terraform init -input=false
      - run: terraform validate

      # PR plans run as the read-only ci-reader, which can't write the state
      # lock, so they skip locking (a plan never writes state anyway).
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan ${{ env.IS_DEPLOY == 'true' && '-lock-timeout=5m' || '-lock=false' }}

      - name: Plan summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan | tail -c 60000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: terraform apply (main only)
        if: env.IS_DEPLOY == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # Fill in the games, lines, scorer lists and averages right away instead of waiting for the
      # next scheduled run (infra/thanksgiving.tf).
      - name: Run the pre-game refresh once (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          gcloud scheduler jobs run tg-pregame-daily --location us-central1 --project "$GCP_PROJECT_ID"
          echo "Started the pre-game refresh (tg-pregame-daily)." >> "$GITHUB_STEP_SUMMARY"

      # The test contest's refresh (docs/thanksgiving-spec.md, "Test contest"): its games and its
      # players Test1-Test10. Same function, ?contest=test, tgTest* collections only.
      - name: Run the test contest's pre-game refresh once (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          gcloud scheduler jobs run tg-test-pregame-hourly --location us-central1 --project "$GCP_PROJECT_ID"
          echo "Started the test contest's pre-game refresh (tg-test-pregame-hourly)." >> "$GITHUB_STEP_SUMMARY"

      - name: Outputs summary (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          {
            echo '### Terraform outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hosting:
    needs: [build, test, infra]
    runs-on: ubuntu-latest
    # Shows in the repo's Deployments panel and on the PR: "preview" for PRs, "production" for main.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.preview.outputs.url || 'https://kylenowski.com' }}
    permissions:
      contents: read
      id-token: write # GCP login (Workload Identity Federation)
      pull-requests: write # put the preview link in the PR description
    steps:
      - uses: actions/checkout@v7 # for firebase.json
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.IS_DEPLOY == 'true' && env.GCP_DEPLOYER_SA || env.GCP_PREVIEW_SA }}

      - name: Deploy live site (main only)
        if: env.IS_DEPLOY == 'true'
        run: |
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project "$GCP_PROJECT_ID" \
            --non-interactive --message "${GITHUB_SHA::7}"
          echo "### Deployed ${GITHUB_SHA::7} to https://kylenowski.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview channel (PRs)
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --no-authorized-domains --project "$GCP_PROJECT_ID" --non-interactive --json > channel.json || { cat channel.json; exit 1; }
          url="$(jq -r '.result[].url' channel.json)"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview URL::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Keeps one block at the top of the PR description, replaced on every push: the preview link
      # and one-click links to the pages whose built HTML differs from the live site
      # (scripts/pr-preview-body.mjs).
      - name: Put the preview links at the top of the PR description (PRs)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DIST: dist
          LIVE: https://kylenowski.com
        run: |
          BODY="$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')" node scripts/pr-preview-body.mjs > body.md
          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@body.md > /dev/null
          { echo '### PR description links'; sed -n '2,3p' body.md; } >> "$GITHUB_STEP_SUMMARY"

  # Read-only checks against the live site after a production deploy (tests/smoke): the pages load
  # without console errors, the app reaches Firestore, and the sign-in service answers.
  smoke:
    needs: [hosting]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests against https://kylenowski.com
        run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report-smoke
          retention-days: 7

  # Tells the merged PR whether the deploy worked, so a failure after merging isn't missed.
  report:
    needs: [build, test, infra, hosting, smoke]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          INFRA: ${{ needs.infra.result }}
          HOSTING: ${{ needs.hosting.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "⚪";; *) echo "❌";; esac; }
          if [ "$TEST$BUILD$INFRA$HOSTING$SMOKE" = "successsuccesssuccesssuccesssuccess" ]; then
            head="✅ **Deployed to [kylenowski.com](https://kylenowski.com)** (${SHA::7}), and the live smoke tests passed."
          else
            head="❌ **Deploy of ${SHA::7} did not finish.** The live site may still be on the previous version. [See the run]($RUN_URL)."
          fi
          body="$(printf '%s\n\n| Step | Result |\n|---|---|\n| Tests | %s %s |\n| Build | %s %s |\n| Infra (Terraform apply) | %s %s |\n| Live site upload | %s %s |\n| Smoke tests on the live site | %s %s |\n\n[Run](%s)' \
            "$head" "$(icon "$TEST")" "$TEST" "$(icon "$BUILD")" "$BUILD" "$(icon "$INFRA")" "$INFRA" \
            "$(icon "$HOSTING")" "$HOSTING" "$(icon "$SMOKE")" "$SMOKE" "$RUN_URL")"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          for pr in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].number'); do
            gh api "repos/$REPO/issues/$pr/comments" -f body="$body" > /dev/null
            echo "Commented on #$pr"
          done
