name: deploy

# PRs to main:    build + unit tests, emulator tests, e2e tests, security review, terraform plan
#                 (read-only), Firebase Hosting preview channel, and runtime security checks against
#                 the preview URL (all parallelized).
# Pushes to main: build + unit tests, emulator tests, e2e tests, security review -> terraform apply
#                 -> deploy dist/ to the live site -> live smoke + security tests -> comment on the
#                 merged PR.
# Nothing is applied or deployed to production unless all tests and the security gate pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs immediately; never cancel in-progress deploys on main (GCS locks state).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  FIREBASE_TOOLS: firebase-tools@15.37.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  GCP_PROJECT_ID: kylenowski-com
  GCP_WIF_PROVIDER: projects/420500505231/locations/global/workloadIdentityPools/github/providers/github
  # ci-deployer can only be used by runs on refs/heads/main (enforced in GCP IAM).
  GCP_DEPLOYER_SA: ci-deployer@kylenowski-com.iam.gserviceaccount.com
  GCP_READER_SA: ci-reader@kylenowski-com.iam.gserviceaccount.com
  GCP_PREVIEW_SA: ci-preview@kylenowski-com.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Build site
        run: npm run build # astro check + astro build
      - name: Build Cloud Functions bundle
        run: npm run build:functions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: functions-dist
          path: functions/dist
          retention-days: 1

  # docs/thanksgiving-spec.md, "Testing". Firestore rules, sign-in service, admin, live worker,
  # practice games, and pre-game refresh against the Firebase emulators.
  test-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Emulator tests (rules, sign-in service, pre-game refresh)
        run: npm run test:emulator

  # docs/thanksgiving-spec.md, "Testing". End-to-end in a browser against local emulators.
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: End-to-end tests
        env:
          # ubuntu-latest ships Google Chrome preinstalled, avoiding ~20s of apt-get + browser downloads.
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Fast security review gate (runs in parallel with build and tests, gates production deploys):
  #   - Blocking (PRs + main): secrets (Gitleaks), high/critical SAST (Semgrep), high/critical IaC
  #     (Trivy), workflow security & shell linting (zizmor, actionlint, shellcheck).
  #   - Blocking (PRs only): newly introduced high/critical CVEs (dependency-review-action), so a
  #     freshly disclosed CVE cannot lock out a game-day hotfix on main.
  #   - Advisory (Security tab SARIF): medium/low findings and full-lockfile CVE inventory.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Install Gitleaks and actionlint
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Semgrep and zizmor
        run: python3 -m pip install --quiet semgrep zizmor

      - name: Secrets scan (Gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --verbose --redact --no-banner .
          else
            gitleaks git --verbose --redact --no-banner .
          fi

      - name: SAST scan (Semgrep)
        id: semgrep
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --config p/secrets \
            --sarif --sarif-output=semgrep.sarif \
            --quiet --exclude tests/fixtures \
            src/ functions/src/ scripts/
          errors="$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)"
          total="$(jq '[.runs[].results[]] | length' semgrep.sarif)"
          echo "Semgrep findings: ${total} total, ${errors} error(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$errors" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level == "error") | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' semgrep.sarif
            exit 1
          fi

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: IaC scan (Trivy Terraform)
        run: |
          set -euo pipefail
          trivy config --ignorefile .trivyignore.yaml \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif --output trivy-iac.sarif infra/
          trivy config --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL --exit-code 1 infra/

      - name: Upload Trivy IaC SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Dependency audit (Trivy SCA, advisory)
        run: |
          set -euo pipefail
          trivy fs --scanners vuln --include-dev-deps \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif --output trivy-sca.sarif .
          {
            echo '### Dependency vulnerability inventory (advisory)'
            echo '```'
            trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SCA SARIF
        if: always() && hashFiles('trivy-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca

      - name: Workflow security audit (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          zizmor --format sarif .github/ > zizmor.sarif
          rc=$?
          set -e
          # zizmor exit codes: 0 = clean, 10..13 = unknown/info/low/medium, 14 = high, 1..9 = tool error.
          if [ "$rc" -eq 14 ] || { [ "$rc" -ne 0 ] && [ "$rc" -lt 10 ]; }; then
            zizmor .github/ || true
            exit "$rc"
          fi

      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Workflow & shell linting (actionlint + shellcheck)
        run: |
          set -euo pipefail
          actionlint -color=false
          shellcheck scripts/*.sh

  # Read-only Terraform plan on PRs (and non-main dispatches), running in parallel with tests.
  infra-plan:
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> GCP Workload Identity Federation (no keys)
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Thanksgiving admin's email address: a sensitive Terraform variable, so it's hidden in plans.
      TF_VAR_admin_email: ${{ secrets.TG_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: functions-dist
          path: functions/dist

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_READER_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - name: Enable Terraform plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      # PR plans run as the read-only ci-reader, which can't write the state
      # lock, so they skip locking (a plan never writes state anyway).
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan -lock=false

      - name: Plan summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan | tail -c 60000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Production Terraform apply on main, strictly gated behind all build, test, and security jobs.
  infra-apply:
    needs: [build, test-emulator, test-e2e, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> GCP Workload Identity Federation (no keys)
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Thanksgiving admin's email address: a sensitive Terraform variable, so it's hidden in plans.
      TF_VAR_admin_email: ${{ secrets.TG_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: functions-dist
          path: functions/dist

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - name: Enable Terraform plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan -lock-timeout=5m

      - name: Plan summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan | tail -c 60000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # Fill in the games, lines, scorer lists and averages right away instead of waiting for the
      # next scheduled run (infra/thanksgiving.tf).
      - name: Run the pre-game refresh once
        run: |
          gcloud scheduler jobs run tg-pregame-daily --location us-central1 --project "$GCP_PROJECT_ID"
          echo "Started the pre-game refresh (tg-pregame-daily)." >> "$GITHUB_STEP_SUMMARY"

      - name: Outputs summary
        run: |
          {
            echo '### Terraform outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # PR preview channel: deploys as soon as build finishes, in parallel with tests and infra-plan.
  hosting-preview:
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    outputs:
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      id-token: write # GCP login (Workload Identity Federation)
      pull-requests: write # put the preview link in the PR description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # for firebase.json and scripts/pr-preview-body.mjs
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Cache firebase-tools
        id: firebase-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase-cli
          key: firebase-cli-${{ runner.os }}-${{ env.FIREBASE_TOOLS }}
      - name: Install firebase-tools
        if: steps.firebase-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/firebase-cli
          npm --prefix ~/.cache/firebase-cli install --no-save --no-audit --no-fund "$FIREBASE_TOOLS"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_PREVIEW_SA }}

      - name: Deploy preview channel
        id: preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          "$HOME/.cache/firebase-cli/node_modules/.bin/firebase" hosting:channel:deploy "pr-$PR_NUMBER" \
            --expires 7d --no-authorized-domains --project "$GCP_PROJECT_ID" --non-interactive --json > channel.json || { cat channel.json; exit 1; }
          url="$(jq -r '.result[].url' channel.json)"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview URL::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Keeps one block at the top of the PR description, replaced on every push: the preview link
      # and one-click links to the pages whose built HTML differs from the live site
      # (scripts/pr-preview-body.mjs).
      - name: Put the preview links at the top of the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DIST: dist
          LIVE: https://kylenowski.com
        run: |
          BODY="$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')" node scripts/pr-preview-body.mjs > body.md
          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@body.md > /dev/null
          { echo '### PR description links'; sed -n '2,3p' body.md; } >> "$GITHUB_STEP_SUMMARY"

  # Read-only runtime security assertions against the PR preview channel (headers, CSP, CORS, auth).
  preview-security:
    needs: [hosting-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Read Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache @playwright/test
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/playwright-smoke
          key: playwright-smoke-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install @playwright/test
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          PW_VERSION: ${{ steps.pw.outputs.version }}
        run: |
          mkdir -p ~/.cache/playwright-smoke
          npm --prefix ~/.cache/playwright-smoke install --no-save --no-audit --no-fund "@playwright/test@$PW_VERSION"
      - name: Runtime security assertions against PR preview channel
        env:
          SMOKE_URL: ${{ needs.hosting-preview.outputs.url }}
        run: |
          ln -s "$HOME/.cache/playwright-smoke/node_modules" node_modules
          npm run test:security-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-security-preview
          path: playwright-report-smoke
          retention-days: 7

  # Live production site deploy: strictly after all tests, security review, and Terraform apply pass.
  hosting-live:
    needs: [build, test-emulator, test-e2e, security, infra-apply]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kylenowski.com
    permissions:
      contents: read
      id-token: write # GCP login (Workload Identity Federation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # for firebase.json
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Cache firebase-tools
        id: firebase-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase-cli
          key: firebase-cli-${{ runner.os }}-${{ env.FIREBASE_TOOLS }}
      - name: Install firebase-tools
        if: steps.firebase-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/firebase-cli
          npm --prefix ~/.cache/firebase-cli install --no-save --no-audit --no-fund "$FIREBASE_TOOLS"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - name: Deploy live site
        run: |
          "$HOME/.cache/firebase-cli/node_modules/.bin/firebase" deploy --only hosting --project "$GCP_PROJECT_ID" \
            --non-interactive --message "${GITHUB_SHA::7}"
          echo "### Deployed ${GITHUB_SHA::7} to https://kylenowski.com" >> "$GITHUB_STEP_SUMMARY"

  # Read-only checks against the live site after a production deploy (tests/smoke): the pages load
  # without console errors, security headers/CSP/CORS/auth hold, the app reaches Firestore, and the
  # sign-in service answers.
  smoke:
    needs: [hosting-live]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Read Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache @playwright/test
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/playwright-smoke
          key: playwright-smoke-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install @playwright/test
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          PW_VERSION: ${{ steps.pw.outputs.version }}
        run: |
          mkdir -p ~/.cache/playwright-smoke
          npm --prefix ~/.cache/playwright-smoke install --no-save --no-audit --no-fund "@playwright/test@$PW_VERSION"
      - name: Smoke & security tests against https://kylenowski.com
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          ln -s "$HOME/.cache/playwright-smoke/node_modules" node_modules
          npm run test:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report-smoke
          retention-days: 7

  # Tells the merged PR whether the deploy worked, so a failure after merging isn't missed.
  report:
    needs: [build, test-emulator, test-e2e, security, infra-apply, hosting-live, smoke]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BUILD: ${{ needs.build.result }}
          EMULATOR: ${{ needs.test-emulator.result }}
          E2E: ${{ needs.test-e2e.result }}
          SECURITY: ${{ needs.security.result }}
          INFRA: ${{ needs.infra-apply.result }}
          HOSTING: ${{ needs.hosting-live.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "⚪";; *) echo "❌";; esac; }
          if [ "$BUILD$EMULATOR$E2E$SECURITY$INFRA$HOSTING$SMOKE" = "successsuccesssuccesssuccesssuccesssuccesssuccess" ]; then
            head="✅ **Deployed to [kylenowski.com](https://kylenowski.com)** (${SHA::7}), and the live smoke tests passed."
          else
            head="❌ **Deploy of ${SHA::7} did not finish.** The live site may still be on the previous version. [See the run]($RUN_URL)."
          fi
          body="$(printf '%s\n\n| Step | Result |\n|---|---|\n| Build & unit tests | %s %s |\n| Emulator tests | %s %s |\n| End-to-end tests | %s %s |\n| Security review | %s %s |\n| Infra (Terraform apply) | %s %s |\n| Live site upload | %s %s |\n| Smoke & security tests on the live site | %s %s |\n\n[Run](%s)' \
            "$head" "$(icon "$BUILD")" "$BUILD" "$(icon "$EMULATOR")" "$EMULATOR" "$(icon "$E2E")" "$E2E" \
            "$(icon "$SECURITY")" "$SECURITY" "$(icon "$INFRA")" "$INFRA" "$(icon "$HOSTING")" "$HOSTING" \
            "$(icon "$SMOKE")" "$SMOKE" "$RUN_URL")"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          for pr in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].number'); do
            gh api "repos/$REPO/issues/$pr/comments" -f body="$body" > /dev/null
            echo "Commented on #$pr"
          done
