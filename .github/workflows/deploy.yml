name: deploy

# PRs to main: terraform plan (no changes made) + a Pages preview deployment.
# Pushes to main: terraform apply, then a production deployment of site/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch/PR. Runs on different refs are kept safe by the
# Terraform state lock (use_lockfile in infra/versions.tf).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket    = "kylenowski-tfstate"
          key       = "site/terraform.tfstate"
          endpoints = { s3 = "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" }
          EOF

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Plan summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan | tail -c 60000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -lock-timeout=5m tfplan

  site:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Production on main; a preview deployment (its own *.pages.dev URL) on PRs.
      - name: Pick Pages branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=kylenowski --branch=${{ steps.target.outputs.branch }} --commit-dirty=true

      - name: Deployment summary
        run: |
          echo "### Deployed \`${{ steps.target.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}" >> "$GITHUB_STEP_SUMMARY"
